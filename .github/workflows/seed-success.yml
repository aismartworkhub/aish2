name: Seed — Success Cases

on:
  workflow_dispatch:
    inputs:
      force:
        description: "기존 데이터가 있어도 덮어쓰기 (true/false)"
        required: false
        default: "false"

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install firebase-admin
        run: npm install firebase-admin

      - name: Seed success cases
        run: npx tsx scripts/seed-success-cases.ts
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
